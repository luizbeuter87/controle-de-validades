# H2 console
spring.h2.console.enabled=true

# H2 (local) - mantido comentado para uso de teste
# Conexão H2 (arquivo em disco)
# spring.datasource.url=jdbc:h2:file:./data/validadesdb;AUTO_SERVER=TRUE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=tche
# spring.datasource.password=3430

# PostgreSQL - configure com seus dados reais
spring.datasource.url=jdbc:postgresql://HOST:5432/DBNAME
spring.datasource.username=DBUSER
spring.datasource.password=DBPASS
spring.datasource.driver-class-name=org.postgresql.Driver

# Porta
server.port=8081
server.address=0.0.0.0

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true