<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Validades - Mercado tchê</title>
    
    <!-- Puxando o CSS da pasta css -->
    <!-- A tag <link> associa o estilo visual ao "esqueleto" HTML [5, 6] -->
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

    <!-- TELA DE LOGIN: Estrutura básica de acesso [7] -->
    <div id="telaLogin" class="card">
        <h2>Controle Validades Tchê</h2>
        <div class="login-form">
            <input type="text" id="usuario" placeholder="Usuário">
            <input type="password" id="senha" placeholder="Senha">
            <button class="btn-primary" onclick="autenticar()">Entrar no Sistema</button>
            <p id="erroLogin" class="erro"></p>
        </div>
    </div>

    <!-- SISTEMA PRINCIPAL: Inicia oculto e é ativado pelo JavaScript [8, 9] -->
    <div id="sistemaPrincipal" class="card" style="display: none;">
        <h2>Controle de Validades</h2>
        
        <div class="form-group">
            <input type="text" id="produto" class="full-width" placeholder="Nome do Produto">
            <input type="date" id="dataVencimento">
            <input type="number" id="quantidade" placeholder="Unidades">
            <button class="btn-primary full-width" onclick="adicionarOuSalvar()">Salvar no Inventário</button>
        </div>

        <input type="text" id="busca" class="search-box" placeholder="🔍 Pesquisar produto..." onkeyup="renderizar()">

        <ul id="listaValidades"></ul>

        <button class="btn-logout" onclick="logout()">Sair do Sistema</button>
    </div>

    <!-- Puxando o JavaScript da pasta js -->
    <!-- A tag <script> é colocada no final do body para garantir que o HTML carregue antes da lógica [10, 11] -->
    <script src="/js/script.js"></script>
</body>
</html>
